# https://docs.astral.sh/uv/reference/settings/
# https://packaging.python.org/en/latest/guides/writing-pyproject-toml/

# PROJECT

[project]
name = "proto-transcription"
version = "0.1.0"
description = "Transcribe audio content for personal notes."
authors = [{ name = "irod973" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "click>=8.1.8",
]

# LINKS

[project.urls]
Homepage = "https://github.com/irod973/proto-transcription"
Documentation = "https://irod973.github.io/proto-transcription/"
Repository = "https://github.com/irod973/proto-transcription"
"Bug Tracker" = "https://github.com/irod973/proto-transcription/issues"

# SCRIPTS

[project.scripts]
proto-transcription = "proto_transcription.scripts:main"

# DEPENDENCIES

[dependency-groups]
check = [
    "bandit>=1.8.3",
    "coverage>=7.6.12",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.1",
    "ruff>=0.9.9",
]
commit = ["commitizen>=4.4.1", "pre-commit>=4.1.0"]
dev =[
    "rust-just>=1.39.0",
    "locust>=2.31.8,<3.0.0",
    "pyinstrument>=4.7.3,<5.0.0",
    "pyspy>=0.1.1",

]
doc = ["pdoc>=15.0.1"]


transcription = [
    "faster-whisper>=1.1.0",
    "whisperx>=3.1.6",
    "transformers>=4.50.0",
    "torch>=2.5.0",
    "torchaudio>=2.5.0,<2.9",
]

fastapi = [
    "fastapi[standard]>=0.123.10",
]


# TOOLS

[tool.uv]
default-groups = ["check", "commit", "dev", "doc"]

[tool.bandit]
targets = ["src"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["__main__.py"]

[tool.mypy]
pretty = true
python_version = "3.13"
check_untyped_defs = true
ignore_missing_imports = true
strict = false
disable_error_code = ["import-untyped"]
# See https://mypy.readthedocs.io/en/stable/config_file.html#untyped-definitions-and-calls
disallow_untyped_decorators = false

[tool.pytest.ini_options]
addopts = "--verbosity=2"
pythonpath = ["src"]

[tool.ruff]
fix = true
indent-width = 4
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D103"]

# SYSTEMS

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"
